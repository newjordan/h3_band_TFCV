[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-band-aid"
version = "0.1.0"
description = "Band Aid: timing for MiniMax H3 music videos. Blender blockout performers (piano hands solved from the notes, a drummer from drum onsets) give H3 the key presses and drum hits on the beat; H3 paints the look over them through its Fun ControlNet, and a lock check measures how well it held."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "opencv-python-headless>=4.9",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
blockout = ["matplotlib>=3.8"]
score = [
    "mediapipe>=0.10",
]
sep = [
    "audio-separator>=0.48",
    "onnxruntime>=1.20",
    "torch",
    "torchaudio",
    "librosa>=0.10",
]
sdk = [
    "comfy-sdk>=0.5",
    "comfy-api-proxy>=0.1.6",
]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/newjordan/h3_band_TFCV"
Documentation = "https://github.com/newjordan/h3_band_TFCV#readme"
"Bug Tracker" = "https://github.com/newjordan/h3_band_TFCV/issues"

[tool.setuptools.packages.find]
include = ["blockout*", "h3band*", "comfy_nodes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "h3band"]
addopts = "-q"

[tool.comfy]
PublisherId = "newjordan"
DisplayName = "Band Aid"
Icon = "https://raw.githubusercontent.com/newjordan/h3_band_TFCV/main/docs/media/icon.png"
